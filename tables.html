<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        body{
            font-family:'Gill Sans', sans-serif;
        }
        table{
            width: 60%;
            border: 1px solid #000000;
            margin: auto;
            border-collapse: collapse; /*merge borders*/
        }
        th{
            color:#000000;
            border: 1px solid #000000;
            padding: 12px 8px; 
            text-align: left;
            background-color:#ffe4c4;
        }
        td{
            color:#000000;
            border:1px solid black;
            padding: 12px 6px;text-align:left;
        }
        .salary{
            color:#7fffd4;
            font-weight: bold;
        }
    </style>
</head>
<body>
