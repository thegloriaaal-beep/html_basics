<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        body{
            background-color: #f0ffff;
            font-family: "Fira Sans", sans-serif;
        }
        form{
            width:35%;
            border: 1px solid rgb(57, 219, 25);
            padding: 12px;
            color: rgb(31, 13, 13);
            margin: auto;
        }
        .lbl-full{
            display: block; /*stretch the whole width*/
            color: #ffe4c4;
        }
        .input-full-w{
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>
    <form action="'">
        <label  class="lbl-full" for="full-name">First and last name:</label>
        <input class="input-full-w" type="text" name="Full name" id="full-name" placeholder="Enter full name" required>

        <label class="lbl-full" for="email">Email:</label>
        <input class="input-full-w" type="email" name="email" id="email" placeholder="Enter email" required>

        <label class="lbl-full" for="password">Password:</label>
        <input class="input-full-w" type="password" name="password" id="password" placeholder="*******"  required>

        <label class="lbl-full" for="phone">phone number</label>
        <input class="input-full-w" type="tel" name="phone" id="phone" placeholder="0712345678" required>


        <label class="lbl-full" for="dob">Date of birth:</label>
        <input class="input-full-w" type="date" name="dob" id="dob" required mim="1940-01-01" required max="2026-13-10">

        <label  class="lbl-full"for="gender">Gender:</label>

        <input type="radio" name="gender" id="gender" value ="male">
        <label for="male">Male</label>


        <input type="radio" name="gender" id="female" value ="female">
        <label for="female">Female</label>

        <br>
        <p>select your favorite sports</p>
        <input type="checkbox" name="Rugby" id="Rugby" value="Rugby">
        <label for="Rugby">Rugby</label>
        <br>

        <input type="checkbox" name="Soccer" id="Soccer" value="Soccer">
        <label for="Soccer">Soccer</label>
        <br>

        <input type="checkbox" name="Basketball" id="Basketball" value="Basketball">
        <label for="Basketball">Basketball</label>
        <br>
        
        <label class="lbl-full" for="county">county</label>
        <select name="county" id="county">
            <option value="Nairobi">Nairobi</option>
            <option value="Mombasa">Mombasa</option>
        
             
        
        </select>
        

        <button type="submit">Submit</button>

    </form>
</body>
</html>
